<style>

*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Zen Kaku Gothic New",system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:18px;line-height:1.1;font-weight:900;flex:1}
header small{display:block;font-size:12px;font-weight:400;opacity:.9;margin-top:2px}
.lang{display:flex;background:rgba(255,255,255,.18);border-radius:99px;padding:3px}
.lang button{border:0;background:none;color:#fff;padding:6px 11px;border-radius:99px;font-weight:700;font-size:13px;cursor:pointer;min-height:34px}
.lang button[aria-pressed=true]{background:#fff;color:var(--red)}
.wx{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:var(--soft);scrollbar-width:none}
.wx::-webkit-scrollbar,.chips::-webkit-scrollbar,.opts::-webkit-scrollbar{display:none}
.wxd{flex:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 9px;font-size:12px;line-height:1.3}
.wxd b{font-size:11px;color:var(--mute);font-weight:700;margin-right:4px}.wxd .t{font-size:14px;font-weight:900}
.wxd.trip{border-color:var(--red)}
.wxbtn{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;line-height:1.2}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.days{display:flex;align-items:stretch;position:sticky;top:0;background:var(--bg);z-index:500;border-bottom:1px solid var(--line)}
.dtabs{display:flex;flex:1;overflow-x:auto;scrollbar-width:none;padding:6px 6px 0 10px}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{flex:1 0 auto;border:0;background:none;padding:8px 8px 9px;font-weight:700;font-size:14px;cursor:pointer;color:var(--mute);border-bottom:3px solid transparent;min-height:44px;line-height:1.1}
.dtabs button small{display:block;font-size:11px;font-weight:400}
.dtabs button[aria-selected=true]{color:var(--red);border-color:var(--red)}
.fold{flex:none;border:0;border-left:1px solid var(--line);background:var(--bg);color:var(--red);font-weight:700;font-size:12px;padding:0 12px;cursor:pointer;min-width:64px;line-height:1.15}
#itwrap.folded{display:none}
.wrap.nolist{grid-template-columns:minmax(0,1fr)!important}
.rain{margin:6px 14px 2px;padding:8px 11px;border-radius:10px;background:#e8f1fb;color:#1d4f8a;font-size:13px;line-height:1.35}
@media(prefers-color-scheme:dark){.rain{background:#18283a;color:#a9c8ee}}
.wrap{display:grid;grid-template-columns:minmax(0,1fr)}
.it{list-style:none;margin:0;padding:4px 14px 8px}
.slot{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:50px 24px minmax(0,1fr) 18px;gap:8px;align-items:center;padding:8px 0;min-height:48px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.row .tm{font-weight:900;font-size:14px;white-space:nowrap}
.n{width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center}
.row .lb{display:block;font-size:11px;color:var(--mute);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm{display:block;font-size:15px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .cv{color:var(--mute);transition:transform .2s;font-size:13px}
.slot.open .row .cv{transform:rotate(180deg)}
.slot.open{background:var(--sel);margin:0 -14px;padding:0 14px}
.bk{display:inline-block;font-size:10px;font-weight:700;background:var(--red);color:#fff;border-radius:5px;padding:0 5px;margin-left:5px;vertical-align:2px}
.warn{color:#c0392b;font-weight:700}
.det{padding:0 0 12px 82px;display:none}
.slot.open .det{display:block}
.det p{margin:0 0 8px;font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts a,.acts button{display:inline-flex;align-items:center;min-height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);text-decoration:none;color:var(--ink);font-size:13px;font-weight:700;cursor:pointer}
.acts .pri{background:var(--red);color:#fff;border-color:var(--red)}
.swap{margin:10px 0 0;font-size:12px;color:var(--mute);font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer;text-align:left;line-height:1.25}
.opt small{display:block;color:var(--mute);font-size:11px}
.opt[aria-pressed=true]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
#map{height:46vh;min-height:280px;background:var(--soft);z-index:0}
main{padding:0 14px 40px}
h2{font-size:18px;margin:18px 0 6px;font-weight:900}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;min-height:36px;display:flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.places{list-style:none;margin:0;padding:0}
.pl{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px}
.pl .ic{width:18px;height:18px;border-radius:50%;margin-top:3px;border:2px solid #fff;box-shadow:0 1px 3px #0004}
.pl h3{margin:0;font-size:15px;line-height:1.3;cursor:pointer}
.pl .sub{font-size:12px;color:var(--mute)}
.pl p{margin:3px 0 0;font-size:14px}
.pl.done h3{text-decoration:line-through;opacity:.55}
.add{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--soft)}
.add input,.add select,.add textarea{width:100%;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.add .r{display:flex;gap:8px;flex-wrap:wrap}.add .r>*{flex:1 1 140px}
.note{font-size:12px;color:var(--mute);margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:1000;display:none;max-width:90vw}
.pin{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);color:#fff;font:900 12px/1 system-ui,sans-serif;display:grid;place-items:center}
.pin.big{outline:3px solid #ffd54a}
.leaflet-popup-content{margin:10px 12px;font:14px/1.4 "Zen Kaku Gothic New",system-ui,sans-serif}
.leaflet-popup-content b{font-size:15px}.leaflet-popup-content a{font-weight:700}
.locbtn{background:#fff;border:0;width:40px;height:40px;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.35);cursor:pointer;display:grid;place-items:center}
.me{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}

let base=[];try{base=await (await fetch('places.json',{cache:'no-cache'})).json()}catch(e){}
const $=s=>document.querySelector(s),t=k=>T[L_][k];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all=()=>base.concat(mine),byId=id=>all().find(p=>p.id===id);
const nm=p=>p.mine?p.name:(L_==='ko'?p.ko:p.en), nt=p=>p.mine?p.note:(L_==='ko'?p.nko:p.nen);
const mapsUrl=p=>p.url?p.url:p.pid?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.mine?p.name:p.en)}&query_place_id=${p.pid}`:`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
const dirUrl=p=>`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}${p.pid?'&destination_place_id='+p.pid:''}&travelmode=transit`;
const D=()=>ITIN.find(d=>d.k===day);
const pick=(d,i)=>{const s=d.slots[i],c=choice[d.k+i];return s.opts.includes(c)?c:s.opts[0]};
const isClosed=(p,w)=>p&&p.closed&&p.closed.includes(w);
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2400)}

// map
const map=L.map('map',{zoomControl:true}).setView([36.567,136.656],14);
let glMap=null,origTF={};
function osm(){L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map)}
try{if(!L.maplibreGL||!window.maplibregl)throw 0;
 const gl=L.maplibreGL({style:'https://tiles.openfreemap.org/styles/liberty',attribution:'<a href="https://openfreemap.org">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
 glMap=gl.getMaplibreMap();glMap.on('load',()=>{glMap.getStyle().layers.forEach(l=>{if(l.layout&&l.layout['text-field'])origTF[l.id]=l.layout['text-field']});applyMapLang()});
 glMap.on('error',()=>{if(!glMap.isStyleLoaded()&&!osm.done){osm.done=1;map.removeLayer(gl);osm()}});
}catch(e){osm()}
function applyMapLang(){if(!glMap||!glMap.isStyleLoaded())return;for(const id in origTF){try{glMap.setLayoutProperty(id,'text-field',L_==='ko'?['coalesce',['get','name:ko'],['get','name:latin'],['get','name']]:origTF[id])}catch(e){}}}
const bg=L.layerGroup().addTo(map),fg=L.layerGroup().addTo(map),mk={};
let me=null,acc=null,watching=false;
const Loc=L.Control.extend({options:{position:'topright'},onAdd(){const b=L.DomUtil.create('button','locbtn');b.setAttribute('aria-label','location');
 b.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';
 L.DomEvent.on(b,'click',e=>{L.DomEvent.stop(e);locate(true)});return b}});
map.addControl(new Loc());
function locate(fly,cb){if(!navigator.geolocation){toast(t('noloc'));return}
 navigator.geolocation.getCurrentPosition(pos=>{const ll=[pos.coords.latitude,pos.coords.longitude];showMe(ll,pos.coords.accuracy);if(fly)map.setView(ll,16);cb&&cb(ll);
  if(!watching){watching=true;navigator.geolocation.watchPosition(p=>showMe([p.coords.latitude,p.coords.longitude],p.coords.accuracy),()=>{},{enableHighAccuracy:true,maximumAge:15000})}},
  ()=>toast(t('noloc')),{enableHighAccuracy:true,timeout:12000})}
function showMe(ll,a){if(!me){me=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16]}),zIndexOffset:2000}).addTo(map);acc=L.circle(ll,{radius:a,weight:0,fillColor:'#1a73e8',fillOpacity:.1}).addTo(map)}else{me.setLatLng(ll);acc.setLatLng(ll).setRadius(a)}}
const popup=p=>`<b>${esc(nm(p))}</b><br>${esc(nt(p)||'')}<br><a href="${esc(dirUrl(p))}" target="_blank" rel="noopener">${t('dir')}</a> · <a href="${esc(mapsUrl(p))}" target="_blank" rel="noopener">${t('maps')}</a> · <a href="#" class="golist" data-id="${esc(p.id)}">${t('inlist')}</a>`;
const icon=(c,txt,sz,big)=>L.divIcon({className:'',html:`<div class="pin${big?' big':''}" style="width:${sz}px;height:${sz}px;background:${c}">${txt}</div>`,iconSize:[sz,sz]});
function drawMap(fit){bg.clearLayers();fg.clearLayers();for(const k in mk)delete mk[k];
 const d=D(),used=new Set(),pts=[];
 d.slots.forEach((s,i)=>{const p=byId(pick(d,i));if(!p)return;pts.push({p,i})});
 pts.forEach(x=>used.add(x.p.id));
 all().filter(p=>!used.has(p.id)).forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:icon(COL[p.mine?'mine':p.cat],'',12,p.id===sel),opacity:done[p.id]?.45:.85}).addTo(bg);m.bindPopup(popup(p));mk[p.id]=m});
 const local=pts.filter(x=>x.p.id!=='kmq');
 const seg=[];let cur=[];local.forEach(x=>{const far=cur.length&&Math.abs(cur[cur.length-1][0]-x.p.lat)>.1;if(far){seg.push(cur);cur=[]}cur.push([x.p.lat,x.p.lng])});seg.push(cur);
 seg.forEach(s=>s.length>1&&L.polyline(s,{color:'#a3263a',weight:3,opacity:.6,dashArray:'2 8',lineCap:'round'}).addTo(fg));
 const seen={};pts.forEach(x=>{const p=x.p,key=p.id;seen[key]=(seen[key]||[]).concat(x.i+1)});
 const drawn=new Set();pts.forEach(x=>{const p=x.p;if(drawn.has(p.id))return;drawn.add(p.id);const big=p.id===sel;
  const m=L.marker([p.lat,p.lng],{icon:icon(COL[p.cat]||'#555',seen[p.id].join(','),seen[p.id].length>1?30:24,big),zIndexOffset:big?1500:1000}).addTo(fg);m.bindPopup(popup(p));mk[p.id]=m});
 if(fit){const kz=local.filter(x=>x.p.lat>36.4),sk=local.filter(x=>x.p.lat<36.4);const g=(sk.length>kz.length?sk:kz).map(x=>[x.p.lat,x.p.lng]);if(g.length)map.fitBounds(g,{padding:[30,30],maxZoom:16})}}
function focus(id){const p=byId(id);if(!p)return;sel=id;drawMap();map.setView([p.lat,p.lng],Math.max(map.getZoom(),16));setTimeout(()=>mk[id]?.openPopup(),150);
 if(innerWidth<900)$('#map').scrollIntoView({behavior:'smooth',block:'center'})}

map.on('popupopen',e=>{const a=e.popup.getElement()?.querySelector('.golist');if(a)a.addEventListener('click',ev=>{ev.preventDefault();goList(a.dataset.id)})});
function goList(id){const d=D(),i=d.slots.findIndex((s,k)=>pick(d,k)===id);map.closePopup();
 if(i>=0){open=d.k+i;renderIt();document.querySelector(`.slot[data-s="${i}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});return}
 cat='all';renderCats();renderList();const el=document.getElementById('pl-'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.background='var(--sel)';setTimeout(()=>el.style.background='',2500)}}
// render
function renderDays(){const d=D();$('#days').innerHTML=ITIN.map(x=>`<button role="tab" data-k="${x.k}" aria-selected="${x.k===day}">${t('wd')[x.w]} ${x.date.slice(8)}<small>${esc(x.tab[L_])}</small></button>`).join('');
 const r=$('#rain');if(d.rain){r.hidden=false;r.textContent='☂︎ '+d.rain[L_]}else r.hidden=true;
 const f=$('#fold');f.innerHTML=folded?(L_==='ko'?'일정<br>펼치기 ▾':'Show<br>plan ▾'):(L_==='ko'?'일정<br>접기 ▴':'Hide<br>plan ▴');f.setAttribute('aria-expanded',!folded);$('#itwrap').classList.toggle('folded',folded);document.querySelector('.wrap').classList.toggle('nolist',folded);setTimeout(()=>map.invalidateSize(),50)}
function renderIt(){const d=D();
 $('#it').innerHTML=d.slots.map((s,i)=>{const id=pick(d,i),p=byId(id)||{},sid=d.k+i,c=COL[p.cat]||'#555',cl=isClosed(p,d.w);
  const optsH=s.opts.length>1?`<div class="swap">${t('swap')}</div><div class="opts">${s.opts.map(o=>{const q=byId(o);if(!q)return'';const qc=isClosed(q,d.w);
   return `<button class="opt" data-sw="${o}" aria-pressed="${o===id}"><span class="dot" style="background:${COL[q.cat]}"></span> ${esc(nm(q))}${qc?`<small class="warn">${t('closed')} ${t('wd')[d.w]}</small>`:''}</button>`}).join('')}</div>`:'';
  const note=(L_==='ko'?s.nko:s.nen);
  return `<li class="slot${open===sid?' open':''}" data-s="${i}"><button class="row" data-tg aria-expanded="${open===sid}"><span class="tm">${s.t}</span><span class="n" style="background:${c}">${i+1}</span>
  <span><span class="lb">${esc(s[L_])}${s.bk?`<span class="bk">${t('booked')}</span>`:''}</span><span class="nm">${esc(nm(p)||'')}${cl?` <span class="warn">· ${t('closed')}</span>`:''}</span></span><span class="cv">▾</span></button>
  <div class="det">${note?`<p>${esc(note)}</p>`:''}${nt(p)?`<p>${esc(nt(p))}</p>`:''}
  <div class="acts"><button class="pri" data-show="${id}">${t('onmap')}</button><a href="${esc(dirUrl(p))}" target="_blank" rel="noopener">${t('dir')}</a><a href="${esc(mapsUrl(p))}" target="_blank" rel="noopener">${t('maps')}</a></div>${optsH}</div></li>`}).join('')}
function renderCats(){$('#cats').innerHTML=['all','see','eat','cafe','shop','book'].concat(mine.length?['mine']:[]).map(k=>`<button class="chip" data-c="${k}" aria-pressed="${k===cat}">${k==='all'?'':`<span class="dot" style="background:${COL[k]}"></span>`}${t(k)}</button>`).join('')}
function renderList(){const list=all().filter(p=>cat==='all'||p.cat===cat||(cat==='mine'&&p.mine));
 $('#list').innerHTML=list.map(p=>`<li class="pl${done[p.id]?' done':''}" id="pl-${esc(p.id)}" data-id="${esc(p.id)}"><div class="ic" style="background:${COL[p.mine?'mine':p.cat]}"></div><div>
 <h3 data-show="${esc(p.id)}">${esc(nm(p))}</h3>${!p.mine&&L_==='ko'?`<div class="sub">${esc(p.en)}</div>`:''}${nt(p)?`<p>${esc(nt(p))}</p>`:''}
 <div class="acts" style="margin-top:6px"><button class="pri" data-show="${esc(p.id)}">${t('onmap')}</button><a href="${esc(dirUrl(p))}" target="_blank" rel="noopener">${t('dir')}</a>
 <button data-done>${done[p.id]?t('undo'):t('been')}</button>${p.mine?`<button data-del>${t('del')}</button>`:''}</div></div></li>`).join('')}
function renderText(){document.documentElement.lang=L_;$('#title').innerHTML=`${esc(t('title'))}<small>${esc(t('sub'))}</small>`;
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L_));
 $('#h-places').textContent=t('places');$('#h-add').textContent=t('add');$('#f-name').placeholder=t('name');$('#f-loc').placeholder=t('loc');$('#f-note').placeholder=t('note');
 $('#f-cat').innerHTML=['eat','cafe','see','shop'].map(k=>`<option value="${k}">${t(k)}</option>`).join('');
 $('#pickmap').textContent=t('pick');$('#usehere').textContent=t('here');$('#f-save').textContent=t('save');$('#f-help').textContent=t('help');$('#foot').textContent=t('foot')}
function render(fit){applyMapLang();renderText();renderDays();renderIt();renderCats();renderList();renderWx();drawMap(fit)}

// weather
let wx=store.get('wx',null);
async function loadWx(){const b=$('#wxbtn');if(b)b.textContent='…';
 try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=36.578,36.262&longitude=136.648,136.907&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&current=temperature_2m,weather_code&timezone=Asia%2FTokyo&forecast_days=7');
  if(!r.ok)throw 0;wx={at:Date.now(),d:await r.json()};store.set('wx',wx)}catch(e){toast(t('wxerr'))}renderWx();renderDays()}
const WMO=c=>{const m=[[0,'☀︎','Clear','맑음'],[2,'⛅︎','Partly cloudy','구름 조금'],[3,'☁︎','Cloudy','흐림'],[48,'≋','Fog','안개'],[57,'☂︎','Drizzle','이슬비'],[67,'☂︎','Rain','비'],[77,'❄︎','Snow','눈'],[82,'☂︎','Showers','소나기'],[86,'❄︎','Snow showers','눈 소나기'],[99,'⚡︎','Thunder','뇌우']];
 const f=m.find(x=>c<=x[0])||m[m.length-1];return{i:f[1],s:L_==='ko'?f[3]:f[2]}};
function renderWx(){let h='';const today=jstDate();
 if(wx&&wx.d){const A=Array.isArray(wx.d)?wx.d:[wx.d],names=[t('kz'),t('sk')];
  A.forEach((loc,li)=>{if(!loc.daily)return;
   if(li===0&&loc.current)h+=`<div class="wxd"><b>${t('now')}</b><span class="t">${Math.round(loc.current.temperature_2m)}°</span> ${WMO(loc.current.weather_code).i}</div>`;
   loc.daily.time.forEach((d,i)=>{if(d<today||d>'2026-11-28'||(li===1&&d!=='2026-11-26'))return;const w=WMO(loc.daily.weather_code[i]),wd=new Date(d+'T00:00:00Z').getUTCDay();
    h+=`<div class="wxd trip"><b>${li?names[1]+' ':''}${t('wd')[wd]} ${d.slice(8)}</b><span class="t">${Math.round(loc.daily.temperature_2m_max[i])}°/${Math.round(loc.daily.temperature_2m_min[i])}°</span> ${w.i} ☂︎${loc.daily.precipitation_probability_max[i]??'–'}%</div>`})});
  const at=new Date(wx.at);h+=`<button class="wxbtn" id="wxbtn">↻ ${t('wxr')}<br><small style="font-weight:400">${at.getHours()}:${String(at.getMinutes()).padStart(2,'0')}</small></button>`}
 else h=`<button class="wxbtn" id="wxbtn">↻ ${t('wxr')}</button>`;$('#wx').innerHTML=h}

// events
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-show]');if(!b)return;
 if(b.dataset.l){L_=b.dataset.l;store.set('lang',L_);render();return}
 if(b.id==='wxbtn'){loadWx();return}
 if(b.id==='fold'){folded=!folded;store.set('folded',folded);renderDays();return}
 if(b.dataset.k){day=b.dataset.k;open=null;sel=null;if(folded){folded=false;store.set('folded',false)}render(true);return}
 
 if(b.hasAttribute('data-tg')){const sid=day+b.closest('.slot').dataset.s;open=open===sid?null:sid;renderIt();if(open){sel=pick(D(),+b.closest('.slot').dataset.s);drawMap()}return}
 if(b.dataset.sw){const i=+b.closest('.slot').dataset.s;choice[day+i]=b.dataset.sw;store.set('choice',choice);sel=b.dataset.sw;renderIt();drawMap();toast(t('swapped'));return}
 if(b.dataset.show){focus(b.dataset.show);return}
 if(b.dataset.c){cat=b.dataset.c;renderCats();renderList();return}
 const id=b.closest('.pl')?.dataset.id;
 if(b.hasAttribute('data-done')){done[id]?delete done[id]:done[id]=1;store.set('done',done);renderList();drawMap();return}
 if(b.hasAttribute('data-del')){mine=mine.filter(x=>x.id!==id);store.set('mine',mine);renderCats();renderList();drawMap();return}
 if(b.id==='pickmap'){picking=true;toast(t('pickmsg'));$('#map').scrollIntoView({behavior:'smooth',block:'center'});return}
 if(b.id==='usehere'){locate(false,ll=>{pickLL=ll;$('#f-loc').value=ll[0].toFixed(5)+', '+ll[1].toFixed(5);toast(t('gotloc'))});return}});
map.on('click',e=>{if(!picking)return;picking=false;pickLL=[e.latlng.lat,e.latlng.lng];$('#f-loc').value=pickLL[0].toFixed(5)+', '+pickLL[1].toFixed(5);toast(t('gotloc'));$('#addf').scrollIntoView({behavior:'smooth'})});
$('#addf').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),v=(f.get('loc')||'').trim();
 let m=v.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||v.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||v.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/)||v.match(/^(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)$/);
 let lat,lng;if(m){lat=+m[1];lng=+m[2]}else if(pickLL){[lat,lng]=pickLL}
 if(lat==null){toast(t('needloc'));return}
 const p={id:'m'+Date.now().toString(36),mine:true,cat:f.get('cat'),name:(f.get('name')||'').trim().slice(0,100),note:(f.get('note')||'').trim().slice(0,400),lat,lng,url:/^https:\/\//.test(v)?v:''};
 mine.push(p);store.set('mine',mine);pickLL=null;e.target.reset();cat='all';renderCats();renderList();focus(p.id);toast(t('added'))});

render(true);
if(!wx||Date.now()-wx.at>3*36e5)loadWx();
})();
</script>
</body>
</html>
