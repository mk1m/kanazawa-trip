<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kanazawa · 가나자와</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kanazawa">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --paper:#ffffff;--ink:#1f2a44;--soft:#6c7385;--hair:#e8e7e3;--wash:#f6f5f2;--gold:#b8913a;--goldwash:#fbf6ea;
 --c-see:#9e3341;--c-eat:#b7712a;--c-cafe:#7a5a3c;--c-shop:#6b4f7d;--c-book:#2f4a7a;--c-mine:#4f7a4a;
 --r:14px;--f:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--paper:#14171f;--ink:#e7e5df;--soft:#9aa0ad;--hair:#2a2f3a;--wash:#1b1f29;--goldwash:#262214}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--f);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 18px) 20px 10px}
.top h1{margin:0;font-size:clamp(19px,5.4vw,22px);line-height:1.15;font-weight:600;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--soft);font-size:14px}
.lang{display:flex;gap:2px;font-size:14px}
.lang button{border:0;background:none;padding:8px 6px;white-space:nowrap;color:var(--soft);min-height:40px}
.lang button[aria-pressed=true]{color:var(--ink);font-weight:600}

/* day bar */
.days{position:sticky;top:0;z-index:600;background:var(--paper);display:flex;align-items:stretch;border-bottom:1px solid var(--hair);padding:0 8px 0 12px}
.dtabs{display:flex;flex:1}
.dtabs button{flex:1;border:0;background:none;padding:10px 4px 9px;text-align:center;color:var(--soft);position:relative;min-height:56px;line-height:1.15}
.dtabs b{display:block;font-size:19px;font-weight:500;color:var(--ink);opacity:.55}
.dtabs span{font-size:12px}
.dtabs button[aria-selected=true] b{opacity:1;font-weight:600}
.dtabs button[aria-selected=true]::after{content:"";position:absolute;left:28%;right:28%;bottom:-1px;height:2px;background:var(--gold);border-radius:2px}
.fold{border:0;background:none;color:var(--soft);font-size:13px;padding:0 8px;min-width:52px}

/* day head */
.dayhead{padding:18px 20px 6px}
.dayhead h2{margin:0;font-size:20px;line-height:1.25;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.wx{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:6px;color:var(--soft);font-size:14px}
.wx strong{color:var(--ink);font-weight:500}
.wx .rf{border:0;background:none;color:var(--soft);font-size:13px;padding:6px 0;min-height:32px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--hair)}
.hint{margin:8px 0 0;font-size:14px;color:var(--soft);max-width:60ch}

/* timeline */
.tl{list-style:none;margin:8px 0 0;padding:0 20px 14px;position:relative}
.tl::before{content:"";position:absolute;left:83px;top:22px;bottom:34px;width:1.5px;background:linear-gradient(var(--gold),color-mix(in srgb,var(--gold) 45%,transparent))}
.st{position:relative}
.rw{display:grid;grid-template-columns:44px 28px minmax(0,1fr);gap:0 12px;align-items:start;width:100%;border:0;background:none;text-align:left;padding:11px 0}
.tm{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;padding-top:3px;white-space:nowrap}
.dt{width:24px;height:24px;margin:0 2px;border-radius:50%;background:var(--paper);border:1.5px solid currentColor;display:grid;place-items:center;font-size:11px;font-weight:600;position:relative;z-index:1}
.st.on .dt{background:currentColor}.st.on .dt i{color:#fff}
.dt i{font-style:normal}
.nm{display:block;font-size:16px;font-weight:500;line-height:1.3}
.lb{display:block;font-size:13px;color:var(--soft);margin-top:1px}
.bk,.cl{color:var(--c-see);font-weight:500;margin-left:8px}
.more{display:none;padding:0 0 14px 84px}
.st.on .more{display:block}
.more p{margin:0 0 10px;font-size:14px;line-height:1.55;color:var(--soft);max-width:60ch}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px}
.go{display:inline-flex;align-items:center;min-height:38px;padding:0 16px;border-radius:99px;background:var(--ink);color:var(--paper);text-decoration:none;font-size:14px;font-weight:500}
.tx{border:0;background:none;padding:8px 0;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--hair);min-height:38px}
.alt{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid var(--hair)}
.alt button{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--hair);background:none;text-align:left;padding:10px 0;font-size:15px;min-height:44px}
.alt .rd{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--hair)}
.alt button[aria-pressed=true] .rd{border:5px solid var(--gold)}
.alt small{display:block;font-size:12px;color:var(--c-see)}
.alh{font-size:13px;color:var(--soft);margin:16px 0 2px}

/* map */
.wrap{display:grid;grid-template-columns:minmax(0,1fr)}
#map{height:46vh;min-height:300px;background:var(--wash);z-index:0}
.leaflet-container{font-family:var(--f)}
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 6px 24px rgba(20,24,40,.16)}
.leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.45;min-width:180px}
.leaflet-popup-content b{display:block;font-size:15px;font-weight:600;margin-bottom:2px}
.leaflet-popup-content p{margin:0 0 8px;color:#6c7385}
.leaflet-popup-content .pa{display:flex;gap:14px}
.leaflet-popup-content a{color:#1f2a44;font-weight:500}
.pin{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);color:#fff;font:600 11px/1 var(--f);display:grid;place-items:center}
.pin.sel{box-shadow:0 0 0 3px var(--gold),0 1px 3px rgba(0,0,0,.35)}
.tiny{width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;opacity:.75}
.locbtn{background:#fff;border:0;width:40px;height:40px;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.25);display:grid;place-items:center}
.me{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.22)}

/* places */
main{padding:26px 20px 40px;max-width:720px}
main h2{margin:0 0 10px;font-size:20px;font-weight:600}
.flt{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--hair);margin-bottom:4px}
.flt::-webkit-scrollbar{display:none}
.flt button{flex:none;border:0;background:none;padding:8px 0 10px;font-size:14px;color:var(--soft);position:relative;min-height:40px}
.flt button[aria-pressed=true]{color:var(--ink);font-weight:500}
.flt button[aria-pressed=true]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--gold)}
.pls{list-style:none;margin:0;padding:0}
.pl{border-bottom:1px solid var(--hair)}
.plr{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:12px 0;min-height:48px}
.pd{width:9px;height:9px;border-radius:50%}
.pn{font-size:15px;line-height:1.35}
.pn small{display:block;color:var(--soft);font-size:12px}
.chk{font-size:13px;color:var(--soft)}
.pl.done .pn{color:var(--soft);text-decoration:line-through}
.pl .more{padding:0 0 14px 22px}
.pl.on .more{display:block}
details.add{margin-top:22px}
details.add summary{cursor:pointer;font-size:15px;font-weight:500;padding:8px 0;list-style:none}
details.add summary::-webkit-details-marker{display:none}
details.add summary::before{content:"+ "}
details.add[open] summary::before{content:"− "}
.af{display:grid;gap:10px;padding-top:6px}
.af input,.af select,.af textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--hair);border-radius:10px;background:var(--paper)}
.af .r{display:flex;gap:10px;flex-wrap:wrap}.af .r>*{flex:1 1 140px}
.af .note{font-size:13px;color:var(--soft);margin:0}
.foot{font-size:12px;color:var(--soft);margin-top:30px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-size:14px;z-index:1000;display:none;max-width:90vw}
#itwrap.folded{display:none}
@media(prefers-reduced-motion:no-preference){.st .more,.pl .more{animation:op .18s ease-out}@keyframes op{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}}
@media(min-width:900px){
 .wrap{grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:0}
 .mapcol{position:sticky;top:57px;align-self:start;padding:16px 20px 0 0}
 #map{height:calc(100vh - 90px);border-radius:var(--r)}
 .wrap.nolist{grid-template-columns:minmax(0,1fr)}.wrap.nolist .mapcol{padding-left:20px}
 .top,.days{padding-left:24px}main{padding-left:24px}
}
</style>
</head>
<body>
<header class="top"><div><h1 id="title"></h1><p id="sub"></p></div><div class="lang"><button data-l="en">EN</button><button data-l="ko">한국어</button></div></header>
<nav class="days"><div class="dtabs" id="days" role="tablist"></div><button class="fold" id="fold" aria-expanded="true"></button></nav>
<div class="wrap">
 <section id="itwrap"><div class="dayhead"><h2 id="dtitle"></h2><div class="wx" id="wx"></div><p class="hint" id="hint" hidden></p></div><ol class="tl" id="it"></ol></section>
 <div class="mapcol"><div id="map"></div></div>
</div>
<main>
 <h2 id="h-places"></h2>
 <div class="flt" id="cats"></div>
 <ul class="pls" id="list"></ul>
 <details class="add"><summary id="h-add"></summary>
  <form class="af" id="addf">
   <input name="name" required id="f-name">
   <div class="r"><select name="cat" id="f-cat"></select><input name="loc" id="f-loc"></div>
   <textarea name="note" rows="2" id="f-note"></textarea>
   <div class="r"><button type="button" class="tx" id="pickmap"></button><button type="button" class="tx" id="usehere"></button><button class="go" style="border:0" id="f-save"></button></div>
   <p class="note" id="f-help"></p>
  </form>
 </details>
 <p class="foot" id="foot"></p>
</main>
<div class="toast" id="toast" role="status"></div>

  S('07:20','Check out','체크아웃',['hotel'],{fx:1}),
  S('07:40','Airport bus → Komatsu','공항 리무진 → 고마쓰',['stop3'],{fx:1,nen:'West Exit Stop 3, ~40 min, ¥1,300 each. Check exact times at the stop the day before.',nko:'서쪽 출구 3번, 약 40분, 1인 1,300엔. 전날 시간표 확인.'}),
  S('10:50','Flight KE2190 → Incheon','KE2190 → 인천',['kmq'],{fx:1,bk:1,nen:'Lands ICN 12:50. One international security line, so arrive ~2 h early.',nko:'인천 12:50 도착. 보안검색대 1개, 2시간 전 도착.'})]}];
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const jstDate=()=>new Date(Date.now()+9*36e5).toISOString().slice(0,10);
let L_=store.get('lang',(navigator.language||'').startsWith('ko')?'ko':'en'),cat='all',sel=null,picking=false,pickLL=null,open=null,openPl=null;
let day=(ITIN.find(d=>d.date===jstDate())||ITIN[0]).k;
let folded=store.get('folded',false),done=store.get('done',{}),mine=store.get('mine',[]),choice=store.get('choice',{}),wx=store.get('wx',null);
let base=[];try{base=await (await fetch('places.json',{cache:'no-cache'})).json()}catch(e){}
const $=s=>document.querySelector(s),t=k=>T[L_][k];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all=()=>base.concat(mine),byId=id=>all().find(p=>p.id===id);
const nm=p=>p.mine?p.name:(L_==='ko'?p.ko:p.en),nt=p=>p.mine?p.note:(L_==='ko'?p.nko:p.nen);
const mapsUrl=p=>p.url?p.url:p.pid?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.mine?p.name:p.en)}&query_place_id=${p.pid}`:`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
const dirUrl=p=>`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}${p.pid?'&destination_place_id='+p.pid:''}&travelmode=transit`;
const D=()=>ITIN.find(d=>d.k===day);
const pick=(d,i)=>{const s=d.slots[i],c=choice[d.k+i];return s.opts.includes(c)?c:s.opts[0]};
const isClosed=(p,w)=>!!(p&&p.closed&&p.closed.includes(w));
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2200)}

/* map */
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([36.567,136.656],14);
L.control.zoom({position:'bottomright'}).addTo(map);
let glMap=null,origTF={};
function osm(){L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}
try{if(!L.maplibreGL||!window.maplibregl)throw 0;
 const gl=L.maplibreGL({style:'https://tiles.openfreemap.org/styles/positron',attribution:'© OpenFreeMap © OpenMapTiles © OpenStreetMap'}).addTo(map);
 glMap=gl.getMaplibreMap();glMap.on('load',()=>{glMap.getStyle().layers.forEach(l=>{if(l.layout&&l.layout['text-field'])origTF[l.id]=l.layout['text-field']});applyMapLang()});
 glMap.on('error',()=>{if(!glMap.isStyleLoaded()&&!osm.done){osm.done=1;map.removeLayer(gl);osm()}});
}catch(e){osm()}
function applyMapLang(){if(!glMap||!glMap.isStyleLoaded())return;for(const id in origTF){try{glMap.setLayoutProperty(id,'text-field',L_==='ko'?['coalesce',['get','name:ko'],['get','name:latin'],['get','name']]:origTF[id])}catch(e){}}}
const bg=L.layerGroup().addTo(map),fg=L.layerGroup().addTo(map),mk={};
let me=null,acc=null,watching=false;
const Loc=L.Control.extend({options:{position:'topright'},onAdd(){const b=L.DomUtil.create('button','locbtn');b.setAttribute('aria-label','My location');
 b.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>';
 L.DomEvent.on(b,'click',e=>{L.DomEvent.stop(e);locate(true)});return b}});
map.addControl(new Loc());
function locate(fly,cb){if(!navigator.geolocation){toast(t('noloc'));return}
 navigator.geolocation.getCurrentPosition(pos=>{const ll=[pos.coords.latitude,pos.coords.longitude];showMe(ll,pos.coords.accuracy);if(fly)map.setView(ll,16);cb&&cb(ll);
  if(!watching){watching=true;navigator.geolocation.watchPosition(p=>showMe([p.coords.latitude,p.coords.longitude],p.coords.accuracy),()=>{},{enableHighAccuracy:true,maximumAge:15000})}},
  ()=>toast(t('noloc')),{enableHighAccuracy:true,timeout:12000})}
function showMe(ll,a){if(!me){me=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16]}),zIndexOffset:2000}).addTo(map);acc=L.circle(ll,{radius:a,weight:0,fillColor:'#1a73e8',fillOpacity:.1}).addTo(map)}else{me.setLatLng(ll);acc.setLatLng(ll).setRadius(a)}}
const popup=p=>`<b>${esc(nm(p))}</b>${nt(p)?`<p>${esc(nt(p))}</p>`:''}<div class="pa"><a href="${esc(dirUrl(p))}" target="_blank" rel="noopener">${t('dir')}</a><a href="#" class="golist" data-id="${esc(p.id)}">${t('inlist')}</a></div>`;
const pinI=(c,txt,sz,on)=>L.divIcon({className:'',html:`<div class="pin${on?' sel':''}" style="width:${sz}px;height:${sz}px;background:${c}">${txt}</div>`,iconSize:[sz,sz]});
const dotI=c=>L.divIcon({className:'',html:`<div class="tiny" style="background:${c}"></div>`,iconSize:[9,9]});
function drawMap(fit){bg.clearLayers();fg.clearLayers();for(const k in mk)delete mk[k];
 const d=D(),pts=[];d.slots.forEach((s,i)=>{const p=byId(pick(d,i));if(p)pts.push({p,i})});
 const used=new Set(pts.map(x=>x.p.id));
 all().filter(p=>!used.has(p.id)).forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:p.id===sel?pinI(COL[p.mine?'mine':p.cat],'',18,1):dotI(COL[p.mine?'mine':p.cat])}).addTo(bg);m.bindPopup(popup(p));mk[p.id]=m});
 const local=pts.filter(x=>x.p.id!=='kmq'),seg=[];let cur=[];
 local.forEach(x=>{if(cur.length&&Math.abs(cur[cur.length-1][0]-x.p.lat)>.1){seg.push(cur);cur=[]}cur.push([x.p.lat,x.p.lng])});seg.push(cur);
 seg.forEach(s=>s.length>1&&L.polyline(s,{color:'#b8913a',weight:2.5,opacity:.85,dashArray:'1 7',lineCap:'round'}).addTo(fg));
 const nums={};pts.forEach(x=>{(nums[x.p.id]=nums[x.p.id]||[]).push(x.i+1)});const drawn=new Set();
 pts.forEach(x=>{const p=x.p;if(drawn.has(p.id))return;drawn.add(p.id);const on=p.id===sel,n=nums[p.id];
  const m=L.marker([p.lat,p.lng],{icon:pinI(COL[p.cat]||'#555',n.length>2?n[0]+'+':n.join(','),n.length>1?28:22,on),zIndexOffset:on?1500:1000}).addTo(fg);m.bindPopup(popup(p));mk[p.id]=m});
 if(fit){const kz=local.filter(x=>x.p.lat>36.4),sk=local.filter(x=>x.p.lat<36.4);const g=(sk.length>kz.length?sk:kz).map(x=>[x.p.lat,x.p.lng]);if(g.length)map.fitBounds(g,{padding:[34,34],maxZoom:16})}}
function focus(id){const p=byId(id);if(!p)return;sel=id;drawMap();map.setView([p.lat,p.lng],Math.max(map.getZoom(),16));setTimeout(()=>mk[id]?.openPopup(),150);
 if(innerWidth<900)$('#map').scrollIntoView({behavior:'smooth',block:'center'})}
map.on('popupopen',e=>{const a=e.popup.getElement()?.querySelector('.golist');if(a)a.addEventListener('click',ev=>{ev.preventDefault();goList(a.dataset.id)})});
function goList(id){const d=D(),i=d.slots.findIndex((s,k)=>pick(d,k)===id);map.closePopup();
 if(i>=0){if(folded){folded=false;store.set('folded',false);renderDays()}open=d.k+i;renderIt();document.querySelector(`.st[data-s="${i}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});return}
 cat='all';openPl=id;renderCats();renderList();document.getElementById('pl-'+id)?.scrollIntoView({behavior:'smooth',block:'center'})}

/* render */
function renderDays(){$('#days').innerHTML=ITIN.map(x=>`<button role="tab" data-k="${x.k}" aria-selected="${x.k===day}"><span>${t('wd')[x.w]}</span><b>${x.date.slice(8)}</b></button>`).join('');
 const f=$('#fold');f.textContent=folded?t('show'):t('hide');f.setAttribute('aria-expanded',!folded);
 $('#itwrap').classList.toggle('folded',folded);document.querySelector('.wrap').classList.toggle('nolist',folded);setTimeout(()=>map.invalidateSize(),60)}
const WMO=c=>{const m=[[0,'☀︎','Clear','맑음'],[2,'⛅︎','Partly cloudy','구름 조금'],[3,'☁︎','Cloudy','흐림'],[48,'☁︎','Fog','안개'],[57,'☂︎','Drizzle','이슬비'],[67,'☂︎','Rain','비'],[77,'❄︎','Snow','눈'],[82,'☂︎','Showers','소나기'],[86,'❄︎','Snow','눈'],[99,'☂︎','Storms','뇌우']];
 const f=m.find(x=>c<=x[0])||m[m.length-1];return{i:f[1],s:L_==='ko'?f[3]:f[2]}};
function dayWx(li,date){if(!wx||!wx.d)return null;const A=Array.isArray(wx.d)?wx.d:[wx.d],l=A[li];if(!l||!l.daily)return null;const i=l.daily.time.indexOf(date);if(i<0)return null;
 const w=WMO(l.daily.weather_code[i]);return `${w.i} <strong>${Math.round(l.daily.temperature_2m_max[i])}° / ${Math.round(l.daily.temperature_2m_min[i])}°</strong> ${esc(w.s)}, ${t('rain')} ${l.daily.precipitation_probability_max[i]??'–'}%`}
function renderHead(){const d=D();$('#dtitle').textContent=d[L_];
 let h='';const a=dayWx(0,d.date),b=d.k==='thu'?dayWx(1,d.date):null;
 if(a)h+=`<span>${b?t('kz')+' ':''}${a}</span>`;if(b)h+=`<span>${t('sk')} ${b}</span>`;if(!a&&!b)h+=`<span>${t('wxnone')}</span>`;
 const at=wx?new Date(wx.at):null;h+=(at?`<span>${t('upd')} ${at.getHours()}:${String(at.getMinutes()).padStart(2,'0')}</span>`:'')+`<button class="rf" id="wxbtn">${t('rf')}</button>`;
 $('#wx').innerHTML=h;const hn=$('#hint');if(d.rain){hn.hidden=false;hn.textContent=d.rain[L_]}else hn.hidden=true}
function renderIt(){const d=D();
 $('#it').innerHTML=d.slots.map((s,i)=>{const id=pick(d,i),p=byId(id)||{},sid=d.k+i,c=COL[p.cat]||'#555',cl=isClosed(p,d.w),on=open===sid,note=L_==='ko'?s.nko:s.nen;
  const alts=s.opts.length>1?`<div class="alh">${t('alts')}</div><ul class="alt">${s.opts.map(o=>{const q=byId(o);if(!q)return'';
    return `<li><button data-sw="${o}" aria-pressed="${o===id}"><span class="rd"></span><span>${esc(nm(q))}${isClosed(q,d.w)?`<small>${t('closed')}</small>`:''}</span></button></li>`}).join('')}</ul>`:'';
  return `<li class="st${on?' on':''}" data-s="${i}" style="color:${c}"><button class="rw" data-tg aria-expanded="${on}"><span class="tm">${s.t}</span><span class="dt"><i>${i+1}</i></span>
   <span style="color:var(--ink)"><span class="nm">${esc(nm(p)||'')}</span><span class="lb">${esc(s[L_])}${s.bk?`<span class="bk">${t('booked')}</span>`:''}${cl?`<span class="cl">${t('closed')}</span>`:''}</span></span></button>
   <div class="more" style="color:var(--ink)">${note?`<p>${esc(note)}</p>`:''}${nt(p)?`<p>${esc(nt(p))}</p>`:''}
   <div class="acts"><a class="go" href="${esc(dirUrl(p))}" target="_blank" rel="noopener">${t('dir')}</a><button class="tx" data-show="${id}">${t('onmap')}</button></div>${alts}</div></li>`}).join('')}
function renderCats(){$('#cats').innerHTML=['all','see','eat','cafe','shop','book'].concat(mine.length?['mine']:[]).map(k=>`<button data-c="${k}" aria-pressed="${k===cat}">${t(k)}</button>`).join('')}
const ORD={see:0,eat:1,cafe:2,shop:3,book:4};
function renderList(){const list=all().filter(p=>cat==='all'||p.cat===cat||(cat==='mine'&&p.mine)).sort((a,b)=>(a.mine?-1:ORD[a.cat])-(b.mine?-1:ORD[b.cat]));
 $('#list').innerHTML=list.map(p=>{const on=openPl===p.id;return `<li class="pl${on?' on':''}${done[p.id]?' done':''}" id="pl-${esc(p.id)}" data-id="${esc(p.id)}">
 <button class="plr" data-pt aria-expanded="${on}"><span class="pd" style="background:${COL[p.mine?'mine':p.cat]}"></span><span class="pn">${esc(nm(p))}${!p.mine&&L_==='ko'?`<small>${esc(p.en)}</small>`:''}</span><span class="chk">${done[p.id]?'✓':''}</span></button>
 <div class="more">${nt(p)?`<p>${esc(nt(p))}</p>`:''}<div class="acts"><a class="go" href="${esc(dirUrl(p))}" target="_blank" rel="noopener">${t('dir')}</a><button class="tx" data-show="${esc(p.id)}">${t('onmap')}</button>
 <button class="tx" data-done>${done[p.id]?t('undo')+' ✓':t('been')}</button>${p.mine?`<button class="tx" data-del>${t('del')}</button>`:''}</div></div></li>`}).join('')}
function renderText(){document.documentElement.lang=L_;$('#title').textContent=t('title');$('#sub').textContent=t('sub');
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L_));
 $('#h-places').textContent=t('places');$('#h-add').textContent=t('add');$('#f-name').placeholder=t('name');$('#f-loc').placeholder=t('loc');$('#f-note').placeholder=t('note');
 $('#f-cat').innerHTML=['eat','cafe','see','shop'].map(k=>`<option value="${k}">${t(k)}</option>`).join('');
 $('#pickmap').textContent=t('pick');$('#usehere').textContent=t('here');$('#f-save').textContent=t('save');$('#f-help').textContent=t('help');$('#foot').textContent=t('foot')}
function render(fit){applyMapLang();renderText();renderDays();renderHead();renderIt();renderCats();renderList();drawMap(fit)}

async function loadWx(){const b=$('#wxbtn');if(b)b.textContent='…';
 try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=36.578,36.262&longitude=136.648,136.907&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=7');
  if(!r.ok)throw 0;wx={at:Date.now(),d:await r.json()};store.set('wx',wx)}catch(e){toast(t('wxerr'))}renderHead()}

/* events */
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.l){L_=b.dataset.l;store.set('lang',L_);render();return}
 if(b.id==='wxbtn'){loadWx();return}
 if(b.id==='fold'){folded=!folded;store.set('folded',folded);renderDays();return}
 if(b.dataset.k){day=b.dataset.k;open=null;sel=null;if(folded){folded=false;store.set('folded',false)}render(true);return}
 if(b.hasAttribute('data-tg')){const i=+b.closest('.st').dataset.s,sid=day+i;open=open===sid?null:sid;renderIt();if(open){sel=pick(D(),i);drawMap()}return}
 if(b.dataset.sw){const i=+b.closest('.st').dataset.s;choice[day+i]=b.dataset.sw;store.set('choice',choice);sel=b.dataset.sw;renderIt();drawMap();toast(t('swapped'));return}
 if(b.dataset.show){focus(b.dataset.show);return}
 if(b.dataset.c){cat=b.dataset.c;openPl=null;renderCats();renderList();return}
 const id=b.closest('.pl')?.dataset.id;
 if(b.hasAttribute('data-pt')){openPl=openPl===id?null:id;renderList();return}
 if(b.hasAttribute('data-done')){done[id]?delete done[id]:done[id]=1;store.set('done',done);renderList();return}
 if(b.hasAttribute('data-del')){mine=mine.filter(x=>x.id!==id);store.set('mine',mine);renderCats();renderList();drawMap();return}
 if(b.id==='pickmap'){picking=true;toast(t('pickmsg'));$('#map').scrollIntoView({behavior:'smooth',block:'center'});return}
 if(b.id==='usehere'){locate(false,ll=>{pickLL=ll;$('#f-loc').value=ll[0].toFixed(5)+', '+ll[1].toFixed(5);toast(t('gotloc'))});return}});
map.on('click',e=>{if(!picking)return;picking=false;pickLL=[e.latlng.lat,e.latlng.lng];$('#f-loc').value=pickLL[0].toFixed(5)+', '+pickLL[1].toFixed(5);toast(t('gotloc'));$('details.add').scrollIntoView({behavior:'smooth'})});
$('#addf').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),v=(f.get('loc')||'').trim();
 let m=v.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||v.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||v.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/)||v.match(/^(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)$/);
 let lat,lng;if(m){lat=+m[1];lng=+m[2]}else if(pickLL){[lat,lng]=pickLL}
 if(lat==null){toast(t('needloc'));return}
 const p={id:'m'+Date.now().toString(36),mine:true,cat:f.get('cat'),name:(f.get('name')||'').trim().slice(0,100),note:(f.get('note')||'').trim().slice(0,400),lat,lng,url:/^https:\/\//.test(v)?v:''};
 mine.push(p);store.set('mine',mine);pickLL=null;e.target.reset();cat='all';openPl=p.id;renderCats();renderList();focus(p.id);toast(t('added'))});

render(true);
if(!wx||Date.now()-wx.at>3*36e5)loadWx();
})();
</script>
</body>
</html>
